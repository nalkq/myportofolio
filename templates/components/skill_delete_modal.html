<button type="button"
        class="skill-action-btn delete"
        popovertarget="delete-skill-{{ skill.id }}"
        aria-label="Hapus {{ skill.name }}"
        title="Hapus skill">
    Hapus
</button>

<div id="delete-skill-modal"
     class="experience-delete-modal"
     popover="auto"
     role="dialog"
     aria-labelledby="delete-skill-title">

    <button type="button"
            class="experience-delete-modal__backdrop"
            popovertarget="delete-skill-modal"
            popovertargetaction="hide"
            aria-label="Tutup konfirmasi hapus"></button>

    <div class="experience-delete-modal__content">
        <button type="button"
                class="experience-delete-modal__close"
                popovertarget="delete-skill-modal"
                popovertargetaction="hide"
                aria-label="Tutup konfirmasi hapus">×</button>

        <h2 id="delete-skill-title">Hapus Skill?</h2>
        <p>
            Apakah Anda yakin ingin menghapus
            <strong id="delete-skill-name"></strong>?
        </p>

        <div class="experience-delete-modal__actions">
            <button type="button"
                    class="button button-secondary"
                    popovertarget="delete-skill-modal"
                    popovertargetaction="hide">Batal</button>

            <button type="button"
                    id="confirm-delete-skill"
                    class="button button-danger">Ya, Hapus</button>
        </div>
    </div>
</div>
