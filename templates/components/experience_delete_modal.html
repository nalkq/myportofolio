<!-- Tombol Trigger untuk Popover -->
<button type="button"
        class="skill-action-btn delete"
        popovertarget="delete-experience-{{ experience.id }}"
        aria-label="Hapus {{ experience.title }}"
        title="Hapus pengalaman">
    Hapus
</button>

<!-- Modal Popover -->
<div id="delete-experience-modal"
     class="experience-delete-modal"
     popover="auto"
     role="dialog"
     aria-labelledby="delete-experience-title">
     
    <button type="button"
            class="experience-delete-modal__backdrop"
            popovertarget="delete-experience-modal"
            popovertargetaction="hide"
            aria-label="Tutup konfirmasi hapus"></button>
            
    <div class="experience-delete-modal__content">
        <button type="button"
                class="experience-delete-modal__close"
                popovertarget="delete-experience-modal"
                popovertargetaction="hide"
                aria-label="Tutup konfirmasi hapus">×</button>
                
        <h2 id="delete-experience-title">Hapus Pengalaman?</h2>
        <p>
            Apakah Anda yakin ingin menghapus
            <strong id="delete-experience-name"></strong>?
        </p>
        
        <div class="experience-delete-modal__actions">
            <button type="button"
                    class="button button-secondary"
                    popovertarget="delete-experience-modal"
                    popovertargetaction="hide">Batal</button>
                    
            <button type="button"
                    id="confirm-delete-experience"
                    class="button button-danger">Ya, Hapus</button>
        </div>
    </div>
</div>
