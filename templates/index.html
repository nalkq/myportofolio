<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{name}} - Portfolio</title>

    <!-- External Fonts & Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <!-- Header -->
    <header class="site-header">
        <div class="container header-container">
            <a href="{% url 'main:show_main' %}" class="brand"></a>
            
            <nav class="nav-menu">
                <a href="{% url 'main:show_experience' %}" class="nav-link">Experience</a>
                <a href="{% url 'main:show_skills' %}" class="nav-link">Skills</a>
                <a href="{% url 'main:show_main' %}" class="nav-link">Profile</a>
            </nav>
        </div>
    </header>

    <main>
        <!-- About Me Section -->
        <section class="hero" id="about-me">
            <div class="container hero-grid">
                <!-- Identity Header -->
                <div class="hero-identity">
                    <p class="hero-kicker">Computer Science &middot; Universitas Indonesia</p>
                    <h1>{{name}}</h1>
                </div>

                <!-- Profile Picture -->
                <div class="hero-photo">
                    <div class="photo-block"></div>
                    <img class="avatar" src="/static/img/Kaysan.jpg" alt="Photo of {{name}}">
                </div>

                <!-- Bio Details -->
                <div class="hero-details">
                    <p class="bio">{{bio}}</p>
                    <dl class="meta-list">
                        <div class="meta-row">
                            <dt>NPM</dt>
                            <dd>{{npm}}</dd>
                        </div>
                        <div class="meta-row">
                            <dt>Program</dt>
                            <dd>{{study_program}}</dd>
                        </div>
                    </dl>

                    <!-- Social Media Links -->
                    <div class="social-links">
                        <div class="social-item">
                            <a href="https://github.com/nalkq" target="_blank" class="social-box">
                                <i class="bi bi-github"></i>
                                <span>GITHUB</span>
                            </a>
                            <span class="social-label">github</span>
                        </div>
                        <div class="social-item">
                             <a href="https://linkedin.com/in/kaysan-navid-musyaffa-726983279/" target="_blank" class="social-box">
                                <i class="bi bi-linkedin"></i>
                                <span>LINKEDIN</span>
                            </a>
                            <span class="social-label">linkedin</span>
                        </div>
                        <div class="social-item">
                            <a href="mailto:navidkaysan@gmail.com" class="social-box">
                                <i class="bi bi-envelope-fill"></i>
                                <span>EMAIL</span>
                            </a>
                            <span class="social-label">email</span>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer class="site-footer">
        <div class="container">
            <p>&copy; 2026 {{name}}. Fakultas Ilmu Komputer, Universitas Indonesia.</p>
        </div>
    </footer>
</body>
</html>
